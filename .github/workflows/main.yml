name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o BanglaLandCalc.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: BanglaLandCalc
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp BanglaLandCalc/app/build/outputs/apk/debug/app-debug.apk GJ-land.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GJ-land-apk
          path: GJ-land.apk
